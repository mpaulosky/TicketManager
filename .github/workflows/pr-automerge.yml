---
name: PR Auto-Merge

"on":
  pull_request:
    types: [opened, ready_for_review, reopened, edited, synchronize]
    branches: [main]
  status:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for same-repo PRs
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/squad/automerge-decision.mjs, the tested decision logic.
      - name: Checkout decision module
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/squad

      - name: Enable auto-merge (squash)
        uses: actions/github-script@v9
        with:
          # A merge made with GITHUB_TOKEN is attributed to github-actions,
          # and GitHub starts no workflows from it: the release workflow, its
          # release-blog PR and "Closes #N" all silently skip. Arming and
          # merging with the PAT attributes the merge to a real user.
          github-token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { decideAutoMerge } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/squad/automerge-decision.mjs`
            );
            const { owner, repo } = context.repo;
            const pullRequestPayload = context.payload.pull_request;
            const statusPayload = context.payload.status;
            const checkSuitePayload = context.payload.check_suite;

            let pullNumber;
            if (pullRequestPayload) {
              pullNumber = pullRequestPayload.number;
            } else if (statusPayload) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: statusPayload.sha
              });

              const matching = associated.data.find((pr) => {
                return (
                  pr.state === "open" &&
                  !pr.merged_at &&
                  !pr.draft &&
                  pr.head?.repo?.full_name === `${owner}/${repo}`
                );
              });

              if (!matching) {
                core.info(
                  `Skipping status update for ${statusPayload.sha}: no open PR is associated.`
                );
                return;
              }

              pullNumber = matching.number;
            } else if (checkSuitePayload) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: checkSuitePayload.head_sha
              });

              const matching = associated.data.find((pr) => {
                return (
                  pr.state === "open" &&
                  !pr.merged_at &&
                  !pr.draft &&
                  pr.head?.repo?.full_name === `${owner}/${repo}`
                );
              });

              if (!matching) {
                core.info(
                  `Skipping check suite update for ${checkSuitePayload.head_sha}: no open PR is associated.`
                );
                return;
              }

              pullNumber = matching.number;
            }

            if (!pullNumber) {
              core.info("No pull request number was resolved for this event.");
              return;
            }

            const status = await github.graphql(
              `query AutoMergeStatus(
                 $owner: String!,
                 $repo: String!,
                 $number: Int!
               ) {
                 repository(owner: $owner, name: $repo) {
                   pullRequest(number: $number) {
                     id
                     number
                     state
                     merged
                     isDraft
                     isCrossRepository
                     headRefOid
                     mergeable
                     mergeStateStatus
                     autoMergeRequest {
                       enabledAt
                     }
                   }
                 }
               }`,
              { owner, repo, number: pullNumber }
            );

            const currentPr = status.repository.pullRequest;
            if (!currentPr) {
              core.info(`Skipping PR #${pullNumber}: not found.`);
              return;
            }

            // Arm auto-merge as early as possible and let the main ruleset's
            // required checks decide when the PR is ready (see #239).
            const decision = decideAutoMerge({
              state: currentPr.state,
              merged: currentPr.merged,
              isDraft: currentPr.isDraft,
              isSameRepo: !currentPr.isCrossRepository,
              mergeable: currentPr.mergeable,
              mergeStateStatus: currentPr.mergeStateStatus,
              autoMergeEnabled: currentPr.autoMergeRequest !== null,
            });

            // Merges only the head commit that was checked, never a newer one.
            const mergeNow = async () => {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullNumber,
                merge_method: "squash",
                sha: currentPr.headRefOid,
              });
              core.info(`Merged PR #${pullNumber} (it already met every requirement).`);
            };

            if (decision.action === "skip") {
              core.info(`Skipping PR #${pullNumber}: ${decision.reason}.`);
              return;
            }

            if (decision.action === "merge") {
              await mergeNow();
              return;
            }

            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                   enablePullRequestAutoMerge(input: {
                     pullRequestId: $pullRequestId,
                     mergeMethod: SQUASH
                   }) {
                     pullRequest {
                       number
                     }
                   }
                 }`,
                { pullRequestId: currentPr.id }
              );
            } catch (error) {
              const messages = Array.isArray(error?.errors)
                ? error.errors.map((entry) => entry?.message || "")
                : [];
              const combinedMessage = [error?.message || "", ...messages]
                .join("\n")
                .toLowerCase();

              // Required checks passed between the query and the mutation, so
              // GitHub won't arm auto-merge; merge directly instead.
              if (
                combinedMessage.includes("clean status") ||
                combinedMessage.includes("unstable status")
              ) {
                await mergeNow();
                return;
              }

              // Not armable yet (e.g. mergeability still being computed); a
              // later status or check_suite event will try again.
              if (
                combinedMessage.includes("already merged") ||
                combinedMessage.includes("already enabled") ||
                combinedMessage.includes("mergeable") ||
                combinedMessage.includes("not mergeable")
              ) {
                core.warning(
                  `Skipping PR #${pullNumber}: ${error.message || "Auto-merge is not ready yet."}`
                );
                return;
              }

              throw error;
            }

            core.info(`Auto-merge armed on PR #${pullNumber} (${decision.reason}).`);
