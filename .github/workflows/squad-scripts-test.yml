---
name: Squad Scripts Test
# Runs the tests for the squad scripts: branch/worktree cleanup (bash) and the
# PR auto-merge decision logic (node).

"on":
  pull_request:
    branches:
      - "main"
    paths:
      - "scripts/squad/**"
      - ".github/workflows/pr-automerge.yml"
      - ".github/workflows/squad-scripts-test.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  test:
    name: Test squad scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run cleanup-squad-branches tests
        run: bash scripts/squad/tests/cleanup-squad-branches.test.sh

      - name: Run automerge-decision tests
        run: node --test 'scripts/squad/tests/*.test.mjs'
