---
# Regenerates docs/data/blog-posts.json from docs/blogs/*.md via a PR back to protected main.
# Keeps the checked-in blog post catalog in sync without direct pushes to main.
name: Generate blog posts JSON

"on":
  push:
    branches: ["main"]
    paths:
      - "docs/blogs/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "generate-blog-posts-json"
  cancel-in-progress: true

env:
  MAIN_BRANCH: >-
    ${{ github.event.repository.default_branch || 'main' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] this job pushes with the checkout's credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: GitHub starts no workflows for a push made
          # with GITHUB_TOKEN, so the PR's required checks would never report and
          # it could never merge. Falls back to GITHUB_TOKEN if the secret isn't
          # set, in which case someone has to push to the branch to start CI.
          token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare generated blog posts JSON
        id: prepare_generate_blog_posts_json
        run: |
          python3 .github/scripts/generate-blog-posts-json.py

          if git diff --quiet docs/data/blog-posts.json; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp docs/data/blog-posts.json "$RUNNER_TEMP/blog-posts.json"
          git restore docs/data/blog-posts.json
          echo "docs_changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated blog posts JSON to automation branch
        id: commit_generate_blog_posts_json
        if: steps.prepare_generate_blog_posts_json.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${MAIN_BRANCH}" --depth=1
          git switch -C automation/generate-blog-posts-json "origin/${MAIN_BRANCH}"
          cp "$RUNNER_TEMP/blog-posts.json" docs/data/blog-posts.json

          if git diff --quiet docs/data/blog-posts.json; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No docs/data/blog-posts.json changes to commit against ${MAIN_BRANCH}"
            exit 0
          fi

          git add docs/data/blog-posts.json
          # No [skip ci]: main's required checks must run on this commit.
          git commit -m "docs: regenerate blog-posts.json"
          git push --force-with-lease origin HEAD
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse blog posts JSON PR to main
        if: steps.commit_generate_blog_posts_json.outputs.committed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          # Open the PR as the PAT's user, like the push above, so its workflows
          # run without an "Approve and run" gate.
          github-token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const mainBranch = process.env.MAIN_BRANCH;
            const head = `${owner}:automation/generate-blog-posts-json`;

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: mainBranch,
              head,
              per_page: 1
            });

            // [skip-release]: release.yml must not write a release blog for
            // this PR, or that blog would trigger this workflow again.
            const title =
              'docs: regenerate docs/data/blog-posts.json [skip-release]';

            if (openPrs.data.length > 0) {
              const existing = openPrs.data[0];
              core.info(`Existing blog posts JSON PR found: #${existing.number}`);
              // A PR opened before the title carried the marker would still
              // get a release blog, so add it.
              if (!existing.title.includes('[skip-release]')) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: existing.number,
                  title
                });
              }
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: mainBranch,
              head: 'automation/generate-blog-posts-json',
              title,
              body: [
                'Automated blog post catalog regeneration PR for protected main.',
                '',
                '- Trigger: push to `main` affecting `docs/blogs/**`',
                '- Behavior: commits `docs/data/blog-posts.json` updates to',
                '  `automation/generate-blog-posts-json`',
                '- Target: opens or reuses a PR into `main`'
              ].join('\n')
            });

            core.info(`Created blog posts JSON PR #${created.data.number}`);
