# yamllint disable rule:line-length
---
name: Build and Test Suite

# NOTE: All test projects now use 'dotnet test' consistently.
# This was updated to fix issues with direct executable execution that were
# causing "No such file or directory" errors in CI.
#
# NOTE: The "Build Solution" job is a required status check on main's
# ruleset, so this workflow itself still triggers on every pull_request
# (no paths-ignore/paths filter on the trigger - see PR #26). Instead, the
# "changes" job below detects whether src/tests/project files actually
# changed and the downstream jobs are skipped via `if:` when they didn't.
# GitHub treats a skipped required check as passing, so docs/config-only
# PRs still merge cleanly without paying for a full build+test run.
#
# NOTE: The "Tests: *" required checks are matrix entries (one per test
# project, named by discover-tests' output). A job's `if:` is implicitly
# ANDed with success(), so without always() on "discover-tests" and "test"
# below, a skipped "build" would skip them too - and a skipped matrix job
# never creates its named check runs at all, leaving the required checks
# permanently missing (not skipped) and blocking merge. always() keeps
# both jobs running so each matrix entry reports SKIPPED by name.

# Read-only by default: build and test jobs run pull-request code. Only the
# report job, which runs no PR code, gets write access.
permissions:
  contents: read

"on":
  workflow_call:
    inputs:
      project_name:
        description: "Solution name without .slnx"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

  # No paths-ignore here: see the NOTE at the top of this file for why
  # the trigger stays broad while the "changes" job gates the actual work.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      project_name:
        description: "Solution name without .slnx"
        required: false
        default: ""
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual test run"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_NAME: ${{ inputs.project_name || github.event.repository.name }}.slnx
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # Aspire parameter bindings for E2E.Tests
  # (Parameters: auth0MgmtClientId/Secret)
  Auth0__Domain: ${{ secrets.AUTH0_DOMAIN }}
  Auth0__ClientId: ${{ secrets.AUTH0_CLIENT_ID }}
  Auth0__ClientSecret: ${{ secrets.AUTH0_CLIENT_SECRET }}
  Auth0Management__ClientId: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
  Auth0Management__ClientSecret: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
  Auth0Management__Domain: ${{ secrets.AUTH0_DOMAIN }}
  Auth0Management__Audience: https://${{ secrets.AUTH0_DOMAIN }}/api/v2/
  Parameters__auth0MgmtClientId: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
  Parameters__auth0MgmtClientSecret: >-
    ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.force.outputs.run == 'true' || steps.filter.outputs.code == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Force run on manual/reusable triggers
        id: force
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for src/test changes
        id: filter
        if: steps.force.outputs.run == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/ci.yml'

  build:
    name: Build Solution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      # The web project's build runs pnpm (Tailwind CSS); the pnpm version
      # comes from "packageManager" in its package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: src/Web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install pnpm dependencies
        working-directory: src/Web
        run: pnpm install --frozen-lockfile

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{
            hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Discover solution file
        run: |
          mapfile -t matches < <(find . -maxdepth 1 -name '*.slnx')
          count=${#matches[@]}
          if [[ $count -eq 0 ]]; then
            echo "::error::No *.slnx file found at the repository root."
            exit 1
          elif [[ $count -gt 1 ]]; then
            echo "::error::Multiple *.slnx files found"
            echo "::error::${matches[*]}"
            exit 1
          fi
          echo "SOLUTION_FILE=${matches[0]}" >> "$GITHUB_ENV"
          echo "Discovered solution: ${matches[0]}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: >-
          dotnet build "$SOLUTION_FILE" --configuration Release
          --no-restore

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            **/bin/Release/
            **/obj/
          key: >-
            ${{ runner.os }}-build-${{ hashFiles('**/*.csproj',
            '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

  discover-tests:
    # always(): this job must still populate the test matrix (so the
    # per-project "Tests: *" required checks below get a named, skipped
    # check run instead of never reporting at all) even when "build" was
    # skipped because no src/tests files changed. Without always(), the
    # implicit `success()` gate would skip this job whenever its "build"
    # dependency skips, leaving the matrix empty.
    #
    # Dependabot PRs run the full test suite too: a dependency bump is
    # exactly the change the tests must vet, and no test here needs a secret.
    if: ${{ always() }}
    name: Discover Test Projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Discover test projects
        id: discover
        run: |
          matrix_json=$(python - <<'PY'
          import json
          from pathlib import Path

          projects = []
          for csproj in sorted(Path("tests").glob("**/*.csproj")):
              folder = csproj.parent.name
              lowered = folder.lower()
              test_id = lowered.replace(".", "-").replace("_", "-")
              is_e2e = "e2e" in lowered
              csproj_text = csproj.read_text()
              uses_playwright = "Microsoft.Playwright" in csproj_text
              projects.append(
                  {
                      "project_path": csproj.as_posix(),
                      "test_name": folder,
                      "test_id": test_id,
                      "build_before_test": is_e2e,
                      "no_build": is_e2e,
                      "requires_playwright": uses_playwright,
                      "verbosity": "normal" if is_e2e else "minimal",
                  }
              )

          if not projects:
              raise SystemExit("No test projects found under tests/.")

          print(json.dumps({"include": projects}))
          PY
          )

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          project_count=$(echo "$matrix_json" | jq '.include | length')
          echo "::notice::Discovered ${project_count} test projects under"
          echo "::notice::tests/"

  test:
    # always(): each matrix entry is a required status check by exact name
    # (see the ruleset). A matrix job that is skipped at the JOB level
    # collapses into a single unexpanded "Tests: ${{ matrix.test_name }}"
    # check instead of one per matrix entry - so the named required checks
    # never get created and merges stay blocked forever. Keeping the job
    # itself always-on lets the matrix expand normally; the individual
    # steps below are gated on needs.changes.outputs.code instead, so each
    # matrix entry still reports (as a quick no-op success) even when the
    # code didn't change.
    if: ${{ always() }}
    name: "Tests: ${{ matrix.test_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - changes
      - build
      - discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    env:
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
      # Enable Playwright trace/video/screenshot capture for E2E jobs
      PLAYWRIGHT_ARTIFACTS: >-
        ${{ matrix.requires_playwright && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      # The web project's build runs pnpm (Tailwind CSS); the pnpm version
      # comes from "packageManager" in its package.json.
      - name: Setup pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: src/Web/package.json

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install pnpm dependencies
        if: needs.changes.outputs.code == 'true'
        working-directory: src/Web
        run: pnpm install --frozen-lockfile

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{
            hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore

      # Matrix values come from the PR's test project paths: pass them through
      # the environment rather than interpolating them into scripts.
      - name: Build test project
        if: needs.changes.outputs.code == 'true' && matrix.build_before_test
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        run: >-
          dotnet build "$PROJECT_PATH" --configuration Release
          --no-restore

      - name: Install Playwright browsers
        if: needs.changes.outputs.code == 'true' && matrix.requires_playwright
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        run: |
          project_dir="$(dirname "$PROJECT_PATH")"
          playwright_script=$(find "$project_dir/bin/Release" \
            -type f -name "playwright.ps1" | head -n 1)
          if [ -z "$playwright_script" ]; then
            echo "::error::Unable to locate playwright.ps1 for $PROJECT_PATH"
            exit 1
          fi
          pwsh "$playwright_script" install chromium --with-deps

      - name: Run tests
        id: run-tests
        if: needs.changes.outputs.code == 'true'
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
          TEST_ID: ${{ matrix.test_id }}
          VERBOSITY: ${{ matrix.verbosity }}
          NO_BUILD: ${{ matrix.no_build }}
        run: |
          mkdir -p test-results

          no_build_arg=()
          if [ "$NO_BUILD" = "true" ]; then
            no_build_arg=(--no-build)
          fi

          # Microsoft Testing Platform is enabled via global.json for .NET 10, so
          # the coverage and xUnit report args are passed directly to the MTP runner
          # instead of the legacy VSTest collector/Logger syntax.
          # .NET 10 uses Microsoft Testing Platform (MTP), which accepts the
          # xUnit TRX report option but not the legacy VSTest coverage flags.
          dotnet test "$PROJECT_PATH" \
            --configuration Release \
            "${no_build_arg[@]}" \
            --verbosity "$VERBOSITY" \
            --results-directory "$GITHUB_WORKSPACE/test-results" \
            --report-xunit-trx \
            --report-xunit-trx-filename "${TEST_ID}.trx" \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output "${TEST_ID}.cobertura.xml"
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "::error::Test project failed: $PROJECT_PATH"
          fi
          exit $exit_code

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-results-${{ matrix.test_id }}
          path: test-results
          if-no-files-found: ignore

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: needs.changes.outputs.code == 'true' && matrix.requires_playwright
        with:
          name: playwright-artifacts-${{ matrix.test_id }}
          path: tests/Web.Tests.E2E/bin/Release/**/TestResults/playwright-artifacts/
          if-no-files-found: ignore

  coverage:
    if: ${{ always() && needs.changes.outputs.code == 'true' }}
    name: Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - build
      - discover-tests
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: coverage-reports

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"coverage-reports/**/*.cobertura.xml" \
            -targetdir:"./coverage-output" \
            -reporttypes:"Html;Cobertura;JsonSummary" \
            -filefilters:"-**/obj/**/*.cs;-**/*.generated.cs" \
            -verbosity:verbose || echo "::warning::No coverage files found"

      - name: Check coverage threshold
        run: |
          summary_json="./coverage-output/Summary.json"
          if [ -f "./coverage-output/Summary.json" ]; then
            echo "=== Summary.json raw ==="
            cat "$summary_json" | jq . || true
            coverable_expr='.summary.coverablelines // '
            coverable_expr+='.summary.coverableLines // '
            coverable_expr+='.coverablelines // .coverableLines // 0'
            coverable_lines=$(jq -r "$coverable_expr" \
              "$summary_json" 2>/dev/null || echo "0")
            coverage_expr='.summary.linecoverage // .lineCoverage // 0'
            coverage=$(jq -r "$coverage_expr" \
              "$summary_json" 2>/dev/null || echo "0")
            echo "Line Coverage: $coverage%"
            if [ "$coverable_lines" = "0" ]; then
              echo "::warning::No coverable lines found in Summary.json"
              echo "::warning::Skipping threshold check"
            else
              if (( $(echo "$coverage < 80" | bc -l) )); then
                echo "::warning::Code coverage is below 80% threshold"
                echo "::warning::$coverage% (required: 80%)"
                echo "::warning::Continuing without failing the workflow"
              else
                echo "::notice::Coverage gate passed: $coverage% >= 80%"
              fi
            fi
          else
            echo "::warning::Coverage report not available"
            echo "::warning::Skipping threshold check"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-reports
          path: coverage-output

      - name: Publish to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        if: always()
        with:
          files: ./coverage-output/Cobertura.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true

  report:
    if: ${{ always() && needs.changes.outputs.code == 'true' }}
    name: Test Report Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # publish-unit-test-result-action writes a check run and a PR comment.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: read
    needs:
      - changes
      - build
      - discover-tests
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: all-test-results

      # Dependabot runs get a read-only token whatever the job asks for, so the
      # check run and PR comment this writes can't be published there. The
      # "All Tests Passed" job still fails when a test did.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        with:
          files: |
            all-test-results/**/*.trx
            all-test-results/**/*-nunit.xml
          check_name: Test Results Summary
          compare_to_earlier_commit: true

      - name: Generate job summary
        if: always()
        env:
          # PR-controlled project paths: read from the environment, not
          # interpolated into the script.
          TEST_MATRIX: ${{ needs.discover-tests.outputs.matrix }}
          BUILD_STATUS: ${{ needs.build.result }}
          DISCOVER_STATUS: ${{ needs.discover-tests.result }}
          TEST_STATUS: ${{ needs.test.result }}
        run: |
          {
            echo "## Test Execution Summary"
            echo ""
            echo "### Job Status"
            echo "- **Build:** ${BUILD_STATUS}"
            echo "- **Discovered Tests:** ${DISCOVER_STATUS}"
            echo "- **Test Matrix:** ${TEST_STATUS}"
            echo ""
            echo "### Artifacts"
            echo "- Test and coverage reports are in Actions artifacts"
            echo "- Coverage report: \`coverage-reports\`"
            echo ""
            echo "### Discovered Test Projects"
            printf '%s' "$TEST_MATRIX" \
              | jq -r '(.include // [])[].project_path | "- " + .'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_STATUS" == "failure" \
            || "$DISCOVER_STATUS" == "failure" \
            || "$TEST_STATUS" == "failure" ]]; then
            echo "❌ **Overall Status:** FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Overall Status:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The single required check for tests on main (see #239). It always runs, so
  # the check is always reported: a skipped job (e.g. tests for Dependabot PRs,
  # which have no secrets) counts as passing, anything failed or cancelled
  # fails the gate.
  tests-passed:
    if: ${{ always() }}
    name: All Tests Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build
      - discover-tests
      - test
    steps:
      - name: Check build and test results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DISCOVER_RESULT: ${{ needs.discover-tests.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "build=$BUILD_RESULT discover-tests=$DISCOVER_RESULT test=$TEST_RESULT"
          for result in "$BUILD_RESULT" "$DISCOVER_RESULT" "$TEST_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Build or tests did not pass."
              exit 1
            fi
          done
