---
name: Auto-merge Tests
# Runs the node tests for the PR auto-merge decision logic that
# pr-automerge.yml loads from .github/scripts/automerge-decision.mjs.

"on":
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/scripts/automerge-decision.mjs"
      - ".github/scripts/tests/**"
      - ".github/workflows/pr-automerge.yml"
      - ".github/workflows/automerge-tests.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  test:
    name: Test auto-merge decision logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run automerge-decision tests
        run: node --test '.github/scripts/tests/*.test.mjs'
